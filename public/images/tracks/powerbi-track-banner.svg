<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110B" />
      <stop offset="60%" stop-color="#1B150D" />
      <stop offset="100%" stop-color="#241C0F" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="goldAmbientGlow" cx="68%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#14110B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="scorecardGlow" cx="25%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F2C811" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#14110B" stop-opacity="0" />
    </radialGradient>

    <!-- Card Glassmorphic Background & Border -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1710" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#15110A" stop-opacity="0.96" />
    </linearGradient>
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.40" />
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.10" />
    </linearGradient>

    <!-- Donut Segment Gradients -->
    <linearGradient id="donutGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F2C811" />
    </linearGradient>
    <linearGradient id="donutCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="donutEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="donutCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <!-- Column Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bar4Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C811" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bar5Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F2C811" />
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
    </filter>
    <filter id="emeraldGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="heroBarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cockpit Tech Grid -->
    <pattern id="cockpitGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#F59E0B" stroke-width="0.7" stroke-opacity="0.04" />
      <circle cx="24" cy="24" r="0.7" fill="#F59E0B" fill-opacity="0.14" />
    </pattern>
  </defs>

  <!-- ==================== BASE BACKGROUND LAYER ==================== -->
  <rect width="640" height="320" fill="url(#bgGrad)" />
  <rect width="640" height="320" fill="url(#cockpitGrid)" />
  <rect width="640" height="320" fill="url(#goldAmbientGlow)" />
  <circle cx="160" cy="90" r="140" fill="url(#scorecardGlow)" />

  <!-- Cockpit HUD Accent Borders & Framing -->
  <path d="M 12 24 L 12 12 L 24 12" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
  <path d="M 628 24 L 628 12 L 616 12" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
  <path d="M 12 296 L 12 308 L 24 308" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.2" fill="none" />
  <path d="M 628 296 L 628 308 L 616 308" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="1.2" fill="none" />

  <!-- Top Telemetry Status Header -->
  <g opacity="0.85">
    <text x="24" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.5" fill="#D97706">POWER BI // EXECUTIVE WAR-ROOM BI COCKPIT</text>
    <circle cx="566" cy="17" r="3" fill="#10B981" />
    <circle cx="566" cy="17" r="5" fill="none" stroke="#10B981" stroke-width="0.8" opacity="0.5" />
    <text x="576" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="0.8" fill="#10B981">LIVE DIRECTQUERY</text>
  </g>

  <!-- ==================== 1. EXECUTIVE KPI SCORECARD (Top-Left) ==================== -->
  <g id="kpiScorecard">
    <rect x="24" y="28" width="276" height="112" rx="10" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- Glassmorphic highlight bar -->
    <line x1="36" y1="29" x2="288" y2="29" stroke="#FEF08A" stroke-opacity="0.25" stroke-width="1" />

    <!-- Power BI Brand Miniature Emblem & Title Row -->
    <g transform="translate(38, 42)">
      <rect x="0" y="6" width="3" height="8" rx="1.5" fill="#D97706" />
      <rect x="5" y="3" width="3" height="11" rx="1.5" fill="#F59E0B" />
      <rect x="10" y="0" width="3" height="14" rx="1.5" fill="#F2C811" />
    </g>
    <text x="58" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#FDE68A">ENTERPRISE REVENUE YTD</text>
    <text x="286" y="53" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#D97706" text-anchor="end">USD ($)</text>

    <!-- Bold Metric Display -->
    <text x="38" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">$4,892,100</text>

    <!-- Mini Sparkline Accent -->
    <path d="M 234 82 L 244 78 L 254 81 L 264 71 L 274 74 L 286 65" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
    <circle cx="286" cy="65" r="2.5" fill="#F2C811" />

    <!-- Trend Badge & Comparison Text -->
    <rect x="38" y="101" width="112" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
    <text x="94" y="115.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="middle">▲ +18.4% Target</text>
    <text x="160" y="115.5" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#9CA3AF">vs. Prior Year: $4.13M</text>
  </g>

  <!-- ==================== 2. BENCHMARK COLUMN BAR CHART (Bottom-Left) ==================== -->
  <g id="benchmarkBarChart">
    <rect x="24" y="152" width="276" height="144" rx="10" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- Glassmorphic highlight bar -->
    <line x1="36" y1="153" x2="288" y2="153" stroke="#FEF08A" stroke-opacity="0.25" stroke-width="1" />

    <!-- Header Row -->
    <text x="38" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.0" fill="#FDE68A">QUARTERLY BENCHMARK PERFORMANCE</text>
    <text x="286" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#10B981" text-anchor="end">YTD +32%</text>

    <!-- Horizontal Gridlines & Scales -->
    <line x1="42" y1="196" x2="284" y2="196" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="42" y1="226" x2="284" y2="226" stroke="#F59E0B" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="42" y1="256" x2="284" y2="256" stroke="#F59E0B" stroke-opacity="0.10" stroke-width="1" />
    <!-- Baseline -->
    <line x1="42" y1="268" x2="284" y2="268" stroke="#F59E0B" stroke-opacity="0.25" stroke-width="1" />

    <!-- 5 Ascending Vertical Bars with Rounded Caps -->
    <!-- Bar 1 (Q1: $0.6M) -->
    <rect x="50" y="230" width="24" height="38" rx="4" fill="url(#bar1Grad)" />
    <text x="62" y="225" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#FDE68A" text-anchor="middle">$0.6M</text>
    <text x="62" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">Q1</text>

    <!-- Bar 2 (Q2: $0.9M) -->
    <rect x="98" y="212" width="24" height="56" rx="4" fill="url(#bar2Grad)" />
    <text x="110" y="207" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#FDE68A" text-anchor="middle">$0.9M</text>
    <text x="110" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">Q2</text>

    <!-- Bar 3 (Q3: $1.1M) -->
    <rect x="146" y="196" width="24" height="72" rx="4" fill="url(#bar3Grad)" />
    <text x="158" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#FDE68A" text-anchor="middle">$1.1M</text>
    <text x="158" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">Q3</text>

    <!-- Bar 4 (Q4: $1.4M) -->
    <rect x="194" y="182" width="24" height="86" rx="4" fill="url(#bar4Grad)" />
    <text x="206" y="177" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#FDE68A" text-anchor="middle">$1.4M</text>
    <text x="206" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="600" fill="#9CA3AF" text-anchor="middle">Q4</text>

    <!-- Bar 5 (Proj: $1.8M - Hero Peak Bar with Glow) -->
    <g filter="url(#heroBarGlow)">
      <rect x="242" y="168" width="24" height="100" rx="4" fill="url(#bar5Grad)" stroke="#FEF08A" stroke-width="1" />
    </g>
    <text x="254" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#FEF08A" text-anchor="middle">$1.8M</text>
    <text x="254" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#F2C811" text-anchor="middle">EST</text>

    <!-- Glowing Dashed Horizontal Target Line -->
    <line x1="42" y1="188" x2="284" y2="188" stroke="#10B981" stroke-width="1.8" stroke-dasharray="5 3" filter="url(#emeraldGlow)" />
    <line x1="42" y1="188" x2="284" y2="188" stroke="#34D399" stroke-width="1.2" stroke-dasharray="5 3" />
    <rect x="236" y="181" width="48" height="14" rx="3" fill="#064E3B" stroke="#10B981" stroke-width="0.8" />
    <text x="260" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#34D399" text-anchor="middle">TARGET</text>
  </g>

  <!-- ==================== 3. MULTI-SEGMENT DONUT CHART (Right) ==================== -->
  <g id="donutChartCockpit">
    <rect x="314" y="28" width="302" height="208" rx="10" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- Glassmorphic highlight bar -->
    <line x1="326" y1="29" x2="602" y2="29" stroke="#FEF08A" stroke-opacity="0.25" stroke-width="1" />

    <!-- Donut Card Header -->
    <text x="330" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#FDE68A">REGIONAL REVENUE ALLOCATION</text>
    <circle cx="584" cy="46" r="3" fill="#10B981" />
    <text x="592" y="49" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#10B981">LIVE</text>

    <!-- Donut Chart Segments (Center: 404, 138; R=58, r=38) -->
    <!-- Segment 1: Power BI Gold 40% -->
    <path d="M 404 80 A 58 58 0 0 1 440.5 183.07 L 427.91 167.53 A 38 38 0 0 0 404 100 Z" fill="url(#donutGold)" />
    <!-- Segment 2: Cyan 25% -->
    <path d="M 438.09 184.92 A 58 58 0 0 1 358.93 174.5 L 374.47 161.91 A 38 38 0 0 0 426.34 168.74 Z" fill="url(#donutCyan)" />
    <!-- Segment 3: Emerald 20% -->
    <path d="M 357.08 172.09 A 58 58 0 0 1 355.36 106.41 L 372.13 117.3 A 38 38 0 0 0 373.26 160.34 Z" fill="url(#donutEmerald)" />
    <!-- Segment 4: Coral 15% -->
    <path d="M 357.08 103.91 A 58 58 0 0 1 400.96 80.08 L 402.01 100.05 A 38 38 0 0 0 373.26 115.66 Z" fill="url(#donutCoral)" />

    <!-- Donut Hole & Center Callout -->
    <circle cx="404" cy="138" r="34" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="404" cy="138" r="32" fill="#13100B" fill-opacity="0.9" />
    <!-- Center Callout Content -->
    <text x="404" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">94.2%</text>
    <text x="404" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.5" fill="#FDE68A" text-anchor="middle">Target SLA</text>

    <!-- Category Legend & Breakdown List -->
    <!-- Item 1: Power BI Gold (40%) -->
    <rect x="480" y="78" width="10" height="10" rx="2" fill="url(#donutGold)" />
    <text x="496" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FDE68A">Enterprise Core</text>
    <text x="602" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="end">40%</text>
    <rect x="496" y="92" width="106" height="2" rx="1" fill="#292015" />
    <rect x="496" y="92" width="42.4" height="2" rx="1" fill="#F2C811" />

    <!-- Item 2: Cyan (25%) -->
    <rect x="480" y="106" width="10" height="10" rx="2" fill="url(#donutCyan)" />
    <text x="496" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#E0F2FE">Cloud Services</text>
    <text x="602" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="end">25%</text>
    <rect x="496" y="120" width="106" height="2" rx="1" fill="#292015" />
    <rect x="496" y="120" width="26.5" height="2" rx="1" fill="#06B6D4" />

    <!-- Item 3: Emerald (20%) -->
    <rect x="480" y="134" width="10" height="10" rx="2" fill="url(#donutEmerald)" />
    <text x="496" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#D1FAE5">Public Sector</text>
    <text x="602" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="end">20%</text>
    <rect x="496" y="148" width="106" height="2" rx="1" fill="#292015" />
    <rect x="496" y="148" width="21.2" height="2" rx="1" fill="#10B981" />

    <!-- Item 4: Coral (15%) -->
    <rect x="480" y="162" width="10" height="10" rx="2" fill="url(#donutCoral)" />
    <text x="496" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFEDD5">Commercial</text>
    <text x="602" y="171" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" text-anchor="end">15%</text>
    <rect x="496" y="176" width="106" height="2" rx="1" fill="#292015" />
    <rect x="496" y="176" width="15.9" height="2" rx="1" fill="#F97316" />

    <!-- Mini Telemetry Footer Inside Donut Card -->
    <text x="330" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#9CA3AF">Active Slicers: Fiscal Year 2026 // Global Tier 1</text>
    <text x="602" y="222" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#F59E0B" text-anchor="end">4 / 4 REGIONS</text>
  </g>

  <!-- ==================== 4. DAX FORMULA BADGE (Bottom-Right) ==================== -->
  <g id="daxFormulaBar">
    <rect x="314" y="248" width="302" height="48" rx="8" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2" filter="url(#cardShadow)" />
    <!-- Glassmorphic highlight bar -->
    <line x1="324" y1="249" x2="606" y2="249" stroke="#FEF08A" stroke-opacity="0.25" stroke-width="1" />

    <!-- fx Badge -->
    <rect x="324" y="258" width="26" height="28" rx="5" fill="#78350F" fill-opacity="0.4" stroke="#F59E0B" stroke-width="1" />
    <text x="337" y="277" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" font-style="italic" fill="#F2C811" text-anchor="middle">fx</text>

    <!-- Syntax-Highlighted DAX Expression -->
    <text x="358" y="269" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">
      <tspan fill="#FDE68A">[Rev YTD]</tspan> <tspan fill="#9CA3AF">=</tspan> <tspan fill="#38BDF8">TOTALYTD</tspan><tspan fill="#FEF3C7">(</tspan>
    </text>
    <text x="368" y="284" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="500">
      <tspan fill="#38BDF8">SUM</tspan><tspan fill="#FEF3C7">(</tspan><tspan fill="#FDE68A">Sales[Amount]</tspan><tspan fill="#FEF3C7">), </tspan><tspan fill="#FB923C">'Date'[Date]</tspan><tspan fill="#FEF3C7">)</tspan>
    </text>

    <!-- DAX Language Pill -->
    <rect x="580" y="254" width="26" height="13" rx="3" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-opacity="0.3" stroke-width="0.8" />
    <text x="593" y="263.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="7.5" font-weight="700" fill="#F59E0B" text-anchor="middle">DAX</text>
  </g>
</svg>
